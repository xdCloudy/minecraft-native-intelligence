plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'minecraft-native-intelligence'
}

loom {
    mods {
        'minecraft-native-intelligence' {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'minecraft-native-intelligence-gametest'
        enableGameTests = true
        enableClientGameTests = false
        // Explicit per-invocation consent, never implied for downstream builders.
        eula = providers.gradleProperty('mni.acceptTestEula')
            .map { it == 'true' }
            .getOrElse(false)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_minecraft-native-intelligence" }
    }
}
