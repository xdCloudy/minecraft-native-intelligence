plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "minecraft_native_intelligence" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'minecraft_native_intelligence_test'
        enableGameTests = true
        enableClientGameTests = false
        // Keep the Mojang EULA opt-in. Running a game-test server requires an
        // operator to accept the EULA explicitly in that run directory.
        eula = false
    }
}

def modVersion = project.version
processResources {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('actionContractTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic action-validator checks without starting Minecraft.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecraftnativeintelligence.ActionRequestValidatorContractTests'
}
